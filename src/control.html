<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSSoehadi Viewer - Control Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Toolbar Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">RSSoehadi Viewer</h1>
          <p class="brand-subtitle">Control Panel</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="toggleSettingBtn" class="btn btn-secondary btn-icon-text active" title="Toggle Settings Toolbar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          Setting
        </button>
      </div>
    </header>

    <!-- Toolbar Banner Status -->
    <div class="toolbar-banner">
      <div class="status-pill">
        <span class="status-dot"></span> Active Viewer Status
      </div>
      <div class="toolbar-status-info">
        <span id="currentUrlDisplay" class="info-truncate">https://google.com</span>
        <span class="dot-separator">•</span>
        <span id="currentMonitorDisplay">Screen 1</span>
      </div>
    </div>

    <!-- Toolbar Setting Panel -->
    <div id="settingToolbarPanel" class="setting-panel">
      <div class="setting-section-header">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span>Konfigurasi Target Webview URL</span>
      </div>

      <div class="card">
        <div class="input-group">
          <input type="text" id="urlInput" class="url-input" placeholder="https://example.com" value="https://google.com">
          <button id="loadBtn" class="btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
            Load URL
          </button>
        </div>
        <div class="presets">
          <span class="preset-chip" data-url="https://google.com">Google</span>
          <span class="preset-chip" data-url="https://bing.com">Bing</span>
          <span class="preset-chip" data-url="https://wikipedia.org">Wikipedia</span>
          <span class="preset-chip" data-url="https://news.ycombinator.com">Hacker News</span>
        </div>
      </div>

      <div class="setting-section-header margin-top-lg">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <span>Kirim ke Secondary Monitor</span>
        <button id="refreshMonitorsBtn" class="btn btn-secondary btn-icon-only margin-left-auto" title="Refresh Monitors">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"></path>
            <path d="M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>

      <div class="card">
        <div id="monitorList" class="monitor-list">
          <div style="color: var(--text-muted); font-size: 0.85rem;">Mendeteksi monitor...</div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Configuration updated</div>

  <script type="module" src="control.js"></script>
</body>
</html>
