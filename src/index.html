<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk Desktop Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Web Content Area -->
  <main class="viewer-content">
    <iframe id="viewerFrame" src="about:blank" title="Kiosk Web Viewer Frame"
      allow="autoplay; speech-synthesis; microphone; camera; display-capture; geolocation; encrypted-media; clipboard-write; clipboard-read; web-share; speaker-selection"></iframe>
    
    <div id="blankLanding" class="blank-landing">
      <div class="loader-box">
        <div class="spinner"></div>
        <h2>Kiosk Desktop Viewer</h2>
        <p>Pilih <strong>Setting &rarr; Setting URL & Profil...</strong> di Window Menu atau klik tombol di bawah untuk memasukkan URL Webview.</p>
        <button id="landingOpenSettingsBtn" class="btn btn-primary margin-top-md">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          Setting URL
        </button>
      </div>
    </div>
  </main>

  <!-- Settings Modal Dialog -->
  <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-group">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </div>
          <h3>Setting URL Kiosk Webview</h3>
        </div>
        <button id="closeSettingsBtn" class="close-btn" title="Tutup Modal">&times;</button>
      </div>

      <div class="modal-body">
        <!-- Preset / Profile Selector -->
        <div class="setting-group">
          <label for="profileSelect" class="setting-label">Pilih Profil Kiosk</label>
          <div class="profile-selector-group">
            <select id="profileSelect" class="url-input">
              <option value="new">+ Tambah Profil Baru (Dokter / Poli Baru)</option>
            </select>
            <button id="deleteProfileBtn" class="btn btn-danger hidden" title="Hapus Profil Terpilih">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Profile Name Input -->
        <div class="setting-group margin-top-sm">
          <label for="profileNameInput" class="setting-label">Nama Profil / Kiosk</label>
          <input type="text" id="profileNameInput" class="url-input" placeholder="Contoh: Poli Dokter Agus">
        </div>

        <!-- Target URL Input -->
        <div class="setting-group margin-top-sm">
          <label for="urlInput" class="setting-label">Alamat URL Target</label>
          <input type="text" id="urlInput" class="url-input" placeholder="https://example.com/kiosk/display" value="">
        </div>
      </div>

      <div class="modal-footer">
        <div class="footer-actions-left">
          <button id="createShortcutBtn" class="btn btn-secondary btn-icon-text" title="Buat Shortcut (.lnk) di Desktop Windows">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            Buat Shortcut Desktop
          </button>
        </div>

        <div class="footer-actions-right">
          <button id="saveAndLoadBtn" class="btn btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
            Simpan & Tampilkan
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Configuration updated</div>

  <script src="app.js"></script>
</body>

</html>
